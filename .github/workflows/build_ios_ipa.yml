name: Build iOS IPA for Diawi & App Store

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

jobs:
  build_ios:
    name: Build Flutter iOS App (.ipa)
    runs-on: macos-14 # Используем современный macOS Apple Silicon чип для быстрой сборки

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: 🛠 Настройка Flutter окружения
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 📦 Установка зависимостей проекта
        run: flutter pub get

      - name: 🍏 Подготовка конфигурации Flutter для iOS
        run: flutter build ios --config-only --release --no-codesign

      - name: 🔨 Компиляция Xcode бинарника (Runner.app) с Ad-Hoc подписью
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "-";/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "-";/g' Runner.xcodeproj/project.pbxproj || true
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE="Manual" AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" -derivedDataPath ../build/ios/xcodebuild

      - name: 🗜 Упаковка Runner.app в архив формата .ipa (Payload)
        run: |
          mkdir -p build/ios/Payload
          mv build/ios/xcodebuild/Build/Products/Release-iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -9 NormPlayer_iOS.ipa Payload
          echo "IPA файл успешно собран: build/ios/NormPlayer_iOS.ipa"

      - name: 📤 Сохранение готового .ipa как артефакт GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: NormPlayer-iOS-IPA
          path: build/ios/NormPlayer_iOS.ipa
          retention-days: 14

      # =========================================================================
      # 💡 ОПЦИОНАЛЬНО: Автоматическая подпись для Diawi через GitHub Secrets
      # Если ты хочешь, чтобы GitHub сам подписывал IPA твоим Apple Developer сертификатом,
      # раскомментируй блок ниже и добавь в Settings -> Secrets своего GitHub репозитория:
      # P12_BASE64, P12_PASSWORD и PROVISION_BASE64.
